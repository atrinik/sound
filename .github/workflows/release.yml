name: Semantic Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'

permissions:
  contents: write
  issues: write
  packages: read
  pull-requests: write

concurrency:
  group: semantic-release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "${GHCR_TOKEN}"
          | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Verify release branch policy
        run: node scripts/release/test-release-policy.cjs
      - name: Analyze commits and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          npx --yes
          --package=semantic-release@25.0.9
          --package=@semantic-release/exec@7.1.0
          --package=conventional-changelog-conventionalcommits@9.3.1
          semantic-release

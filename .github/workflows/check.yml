name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: read
  packages: read

jobs:
  asset-validation:
    name: Asset validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "${GHCR_TOKEN}"
          | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build pinned audio toolchain
        run: >-
          docker build --platform linux/amd64
          --file tools/audio/Dockerfile --tag atrinik-sound-audio .

      - name: Validate package publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/validate.sh
          test -s background/LICENSE
          test -s effects/LICENSE
          git tag v0.0.0 HEAD
          tools/build-release-assets.sh 0.0.0
          test -s build/release/atrinik-sound-0.0.0.tar.gz
          test -s build/release/atrinik-sound-runtime-0.0.0-BLOCKED.json
          test ! -e build/release/atrinik-sound-runtime-0.0.0.tar.gz
          (cd build/release && sha256sum --check SHA256SUMS)

  runtime-fixtures:
    name: Deterministic Opus fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "${GHCR_TOKEN}"
          | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build pinned audio toolchain
        run: >-
          docker build --platform linux/amd64
          --file tools/audio/Dockerfile --tag atrinik-sound-audio .

      - name: Build twice and compare
        run: |
          mkdir -p build/fixture-a build/fixture-b
          for output in fixture-a fixture-b; do
            docker run --rm --platform linux/amd64 \
              --user "$(id -u):$(id -g)" \
              --volume "$PWD:/workspaces/sound:ro" \
              --volume "$PWD/build/${output}:/output" \
              --env SOURCE_DATE_EPOCH=1700000000 \
              --env ATRINIK_SOURCE_COMMIT="$(git rev-parse HEAD)" \
              --env ATRINIK_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')" \
              atrinik-sound-audio \
              python3 tools/sound_release.py \
                build-runtime v0.0.0 /output --fixtures
          done
          cmp \
            build/fixture-a/atrinik-sound-fixture-0.0.0.tar.gz \
            build/fixture-b/atrinik-sound-fixture-0.0.0.tar.gz
          mkdir -p build/fixture-check
          tar -xzf build/fixture-a/atrinik-sound-fixture-0.0.0.tar.gz \
            -C build/fixture-check
          (cd build/fixture-check/atrinik-sound-fixture-0.0.0 && \
            sha256sum --check SHA256SUMS)
          if tar -tzf build/fixture-a/atrinik-sound-fixture-0.0.0.tar.gz \
              | grep -E '\.(mid|mod|s3m|xm|ogg)$'; then
            echo 'fixture runtime archive contains a raw source payload' >&2
            exit 1
          fi

  playtest-tree:
    name: Complete deterministic playtest tree
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "${GHCR_TOKEN}"
          | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build pinned audio toolchain
        run: >-
          docker build --platform linux/amd64
          --file tools/audio/playtest.Dockerfile --tag atrinik-sound-audio .

      - name: Build and verify the complete tree twice
        run: |
          for output in playtest-a playtest-b; do
            docker run --rm --platform linux/amd64 \
              --user "$(id -u):$(id -g)" \
              --volume "$PWD:/workspaces/sound" \
              --workdir /workspaces/sound \
              atrinik-sound-audio \
              python3 tools/sound_release.py build-playtest-tree "build/${output}"
          done
          cmp build/playtest-a/playtest-manifest.json build/playtest-b/playtest-manifest.json
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspaces/sound" \
            --workdir /workspaces/sound \
            atrinik-sound-audio \
            python3 tools/sound_release.py verify-playtest-tree build/playtest-a
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("build/playtest-a")
          manifest = json.loads((root / "playtest-manifest.json").read_text())
          assert manifest["logical_path_count"] == 339
          assert manifest["copied_vorbis_count"] == 189
          assert manifest["converted_opus_count"] == 150
          assets = {asset["logical_path"]: asset for asset in manifest["assets"]}
          assert assets["background/fireside.mid"]["output"]["codec"] == "opus"
          assert assets["background/tutorialisland.mid"]["output"]["codec"] == "opus"
          intro = root / "background/intro.ogg"
          source = Path("background/intro.ogg")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          assert assets["background/intro.ogg"]["mapping"] == "copy"
          assert digest(intro) == digest(source)
          PY

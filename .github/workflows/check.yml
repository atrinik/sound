name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read
  packages: read

jobs:
  asset-validation:
    name: Asset validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "${GHCR_TOKEN}"
          | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build pinned audio toolchain
        run: >-
          docker build --platform linux/amd64
          --file tools/audio/Dockerfile --tag atrinik-sound-audio .

      - name: Validate package publisher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/validate.sh
          test -s background/LICENSE
          test -s effects/LICENSE
          git tag v0.0.0 HEAD
          tools/build-release-assets.sh 0.0.0
          test -s build/release/atrinik-sound-0.0.0.tar.gz
          test -s build/release/atrinik-sound-runtime-0.0.0-BLOCKED.json
          test ! -e build/release/atrinik-sound-runtime-0.0.0.tar.gz
          test -s build/release/atrinik-sound-classic-runtime-0.0.0.tar.gz
          test -s build/release/atrinik-sound-classic-runtime-0.0.0-REMEDIATION.json
          (cd build/release && sha256sum --check SHA256SUMS)

  runtime-fixtures:
    name: Deterministic Opus fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "${GHCR_TOKEN}"
          | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build pinned audio toolchain
        run: >-
          docker build --platform linux/amd64
          --file tools/audio/Dockerfile --tag atrinik-sound-audio .

      - name: Preflight immutable source predecessors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r source_commit source_tree < <(python3 tools/sound_release.py preflight)
          printf 'ATRINIK_RELEASE_INPUT_ATTESTED=1\n' >> "$GITHUB_ENV"
          printf 'ATRINIK_SOURCE_COMMIT=%s\nATRINIK_SOURCE_TREE=%s\n' \
            "$source_commit" "$source_tree" >> "$GITHUB_ENV"

      - name: Build twice and compare
        run: |
          mkdir -p build/fixture-a build/fixture-b
          for output in fixture-a fixture-b; do
            docker run --rm --platform linux/amd64 \
              --user "$(id -u):$(id -g)" \
              --volume "$PWD:/workspaces/sound:ro" \
              --volume "$PWD/build/${output}:/output" \
              --env SOURCE_DATE_EPOCH=1700000000 \
              --env ATRINIK_RELEASE_INPUT_ATTESTED \
              --env ATRINIK_SOURCE_COMMIT \
              --env ATRINIK_SOURCE_TREE \
              atrinik-sound-audio \
              python3 tools/sound_release.py \
                build-runtime v0.0.0 /output --fixtures
          done
          cmp \
            build/fixture-a/atrinik-sound-fixture-0.0.0.tar.gz \
            build/fixture-b/atrinik-sound-fixture-0.0.0.tar.gz
          mkdir -p build/fixture-check
          tar -xzf build/fixture-a/atrinik-sound-fixture-0.0.0.tar.gz \
            -C build/fixture-check
          (cd build/fixture-check/atrinik-sound-fixture-0.0.0 && \
            sha256sum --check SHA256SUMS)
          if tar -tzf build/fixture-a/atrinik-sound-fixture-0.0.0.tar.gz \
              | grep -E '\.(mid|mod|s3m|xm|ogg)$'; then
            echo 'fixture runtime archive contains a raw source payload' >&2
            exit 1
          fi

  playtest-tree:
    name: Complete deterministic playtest tree
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          printf '%s' "${GHCR_TOKEN}"
          | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build pinned audio toolchain
        run: |
          job_started=$(date +%s)
          started=$SECONDS
          report_failure_timing() {
            printf 'playtest phase timing: toolchain=%ss (failed)\n' \
              "$((SECONDS - started))"
            printf 'playtest phase timing: total=%ss (failed)\n' \
              "$(( $(date +%s) - job_started ))"
          }
          trap report_failure_timing EXIT
          docker build --platform linux/amd64 \
            --file tools/audio/playtest.Dockerfile --tag atrinik-sound-audio .
          trap - EXIT
          printf 'playtest phase timing: toolchain=%ss\n' "$((SECONDS - started))"
          printf 'PLAYTEST_JOB_STARTED=%s\n' "$job_started" >> "$GITHUB_ENV"

      - name: Preflight immutable source predecessors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r source_commit source_tree < <(python3 tools/sound_release.py preflight)
          printf 'ATRINIK_RELEASE_INPUT_ATTESTED=1\n' >> "$GITHUB_ENV"
          printf 'ATRINIK_SOURCE_COMMIT=%s\nATRINIK_SOURCE_TREE=%s\n' \
            "$source_commit" "$source_tree" >> "$GITHUB_ENV"

      - name: Build and verify the complete tree twice
        run: |
          phase=setup
          started=$SECONDS
          report_failure_timing() {
            printf 'playtest phase timing: %s=%ss (failed)\n' \
              "$phase" "$((SECONDS - started))"
            printf 'playtest phase timing: total=%ss (failed)\n' \
              "$(( $(date +%s) - PLAYTEST_JOB_STARTED ))"
          }
          trap report_failure_timing EXIT
          for output in playtest-a playtest-b; do
            phase=$output
            started=$SECONDS
            docker run --rm --platform linux/amd64 \
              --network none \
              --user "$(id -u):$(id -g)" \
              --volume "$PWD:/workspaces/sound" \
              --workdir /workspaces/sound \
              --env ATRINIK_RELEASE_INPUT_ATTESTED \
              --env ATRINIK_SOURCE_COMMIT \
              --env ATRINIK_SOURCE_TREE \
              atrinik-sound-audio \
              python3 tools/sound_release.py build-playtest-tree "build/${output}"
            printf 'playtest phase timing: %s=%ss\n' \
              "$output" "$((SECONDS - started))"
          done
          phase=paired-verification
          started=$SECONDS
          docker run --rm --platform linux/amd64 \
            --network none \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/workspaces/sound" \
            --workdir /workspaces/sound \
            --env ATRINIK_RELEASE_INPUT_ATTESTED \
            --env ATRINIK_SOURCE_COMMIT \
            --env ATRINIK_SOURCE_TREE \
            atrinik-sound-audio \
            python3 tools/sound_release.py verify-paired-playtest-trees \
              build/playtest-a build/playtest-b
          printf 'playtest phase timing: paired-verification=%ss\n' \
            "$((SECONDS - started))"
          phase=assertions
          started=$SECONDS
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("build/playtest-a")
          manifest = json.loads((root / "playtest-manifest.json").read_text())
          assert manifest["logical_path_count"] == 339
          assert manifest["copied_vorbis_count"] == 189
          assert manifest["converted_opus_count"] == 150
          assets = {asset["logical_path"]: asset for asset in manifest["assets"]}
          assert assets["background/fireside.mid"]["output"]["codec"] == "opus"
          assert assets["background/tutorialisland.mid"]["output"]["codec"] == "opus"
          intro = root / "background/intro.ogg"
          source = Path("background/intro.ogg")
          digest = lambda path: hashlib.sha256(path.read_bytes()).hexdigest()
          assert assets["background/intro.ogg"]["mapping"] == "copy"
          assert digest(intro) == digest(source)
          PY
          printf 'playtest phase timing: assertions=%ss\n' "$((SECONDS - started))"
          trap - EXIT
          printf 'playtest phase timing: total=%ss\n' \
            "$(( $(date +%s) - PLAYTEST_JOB_STARTED ))"
